server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets con hash se pueden cachear de forma agresiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Mismo contrato que el proxy del dev server: la SPA siempre llama a /api/*.
    location /api/ {
        resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
        set $upstream https://ebind-dev.egl-cloud.com;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host ebind-dev.egl-cloud.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: cualquier ruta desconocida la resuelve vue-router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
